
server:
  port: 8085

spring:
  application:
    name: notification-service

  # PostgreSQL — writes notification_audit (ERD v3: NOTIFICATION_AUDIT owned by notification-service)
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit}
    username: ${POSTGRES_USERNAME:ledger_audit}
    password: ${POSTGRES_PASSWORD:LedgerAuditPass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      service: notification-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
