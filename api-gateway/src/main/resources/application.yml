server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: registration-service
          uri: http://registration-service:8081
          predicates:
            - Path=/api/auth/register/**,/v1/auth/register/**,/api/v1/auth/register/**

        - id: login-service
          uri: http://login-service:8082
          predicates:
            - Path=/api/auth/**,/v1/auth/**,/api/v1/auth/**

        - id: accounts-service
          uri: http://accounts-service:8083
          predicates:
            - Path=/api/accounts/**,/api/v1/accounts/**,/api/recipients/**,/api/v1/recipients/**
          filters:
            - JwtAuthentication

        # Admin account governance (freeze/unfreeze/list) — routed to accounts-service
        - id: admin-accounts-service
          uri: http://accounts-service:8083
          predicates:
            - Path=/api/admin/accounts/**
          filters:
            - JwtAuthentication

        # Admin customer directory — routed to registration-service
        - id: admin-customers-service
          uri: http://registration-service:8081
          predicates:
            - Path=/api/admin/customers/**
          filters:
            - JwtAuthentication

        # Customer profile directory — routed to registration-service
        - id: customer-profile-service
          uri: http://registration-service:8081
          predicates:
            - Path=/api/customers/**
          filters:
            - JwtAuthentication

        - id: transaction-service
          uri: http://transaction-service:8084
          predicates:
            - Path=/api/v1/ledger/**,/api/v1/payments/**,/api/v1/cards/**,/api/v1/transactions/**,/v1/transactions/**,/api/v1/statements/**,/v1/statements/**,/api/v1/admin/**
          filters:
            - JwtAuthentication

        - id: forex-service
          uri: http://forex-service:8087
          predicates:
            - Path=/api/v1/fx-rate,/api/v1/fx-rate/**,/api/v1/forex/**,/api/v1/fx/**

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthentication

        - id: reconciliation-service
          uri: http://reconciliation-service:8086
          predicates:
            - Path=/api/recon/**,/api/v1/recon/**
          filters:
            - JwtAuthentication

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      service: api-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
