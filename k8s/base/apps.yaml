  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: notification-service
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: banking-config
            - secretRef:
                name: banking-app-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker,azure
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: CHANNEL_DB_URL
            - name: POSTGRES_USERNAME
              value: channel_user
