server:
  port: 8087

spring:
  application:
    name: forex-service

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_USERNAME:ledger_app}
    password: ${ORACLE_PASSWORD:LedgerAppPass123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: ForexOracleHikariPool

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: forex-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

forex:
  frankfurter-url: ${FRANKFURTER_URL:https://api.frankfurter.dev/v1/latest}
  poll-interval-ms: ${FOREX_POLL_INTERVAL_MS:3600000}

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  # Add a common 'service' tag to every metric emitted by this service.
  metrics:
    tags:
      service: forex-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.capstone: INFO

