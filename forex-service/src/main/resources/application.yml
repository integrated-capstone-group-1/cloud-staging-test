server:
  port: 8087

spring:
  application:
    name: forex-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit}
    username: ${POSTGRES_USERNAME:ledger_audit}
    password: ${POSTGRES_PASSWORD:LedgerAuditPass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: forex-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

forex:
  frankfurter-url: ${FRANKFURTER_URL:https://api.frankfurter.dev/v1/latest}
  poll-interval-ms: ${FOREX_POLL_INTERVAL_MS:3600000}

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  # Add a common 'service' tag to every metric emitted by this service.
  metrics:
    tags:
      service: forex-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.capstone: INFO

