auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Schema ─────────────────────────────────────────────────────────────────────
# Using TSDB index (recommended for Loki 2.8+) with filesystem storage.
# Single-binary mode — all components run in one process.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ── Ingester ───────────────────────────────────────────────────────────────────
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_transfer_retries: 0
  wal:
    enabled: false

# ── Compactor ──────────────────────────────────────────────────────────────────
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# ── Limits ─────────────────────────────────────────────────────────────────────
# Retention: keep 7 days of logs (suitable for a dev/staging banking environment).
limits_config:
  retention_period: 168h
  # Reject log lines larger than 256 KB to prevent accidental PII/secret dumps.
  max_line_size: 262144
  # Ingestion rate limits (conservative for a local dev stack)
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Max query range: 7 days
  max_query_length: 168h
  # Allow queries without a stream selector (useful during development)
  allow_structured_metadata: true

# ── Query range ────────────────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# ── Storage ────────────────────────────────────────────────────────────────────
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

# ── Ruler ──────────────────────────────────────────────────────────────────────
ruler:
  alertmanager_url: http://localhost:9093

# ── Frontend ───────────────────────────────────────────────────────────────────
frontend:
  max_outstanding_per_tenant: 2048

# ── Analytics ──────────────────────────────────────────────────────────────────
# Disable usage reporting (no outbound telemetry from the banking environment).
analytics:
  reporting_enabled: false
