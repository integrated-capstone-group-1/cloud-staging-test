        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:00:00+08:00"

    LoginApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "Login successful"

        data:
          $ref: "#/components/schemas/LoginResponse"

        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:01:00+08:00"

    VoidApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "Logout successful"

        data:
          type: object
          nullable: true
          example: null

        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:05:00+08:00"

    AccountApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "Account created"

        data:
          $ref: "#/components/schemas/AccountDTO"

        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:10:00+08:00"

    AccountListApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "OK"

        data:
          type: array
          items:
            $ref: "#/components/schemas/AccountDTO"

        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:16:00+08:00"

    BalanceApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "OK"

        data:
          type: number
          format: double
