openapi: 3.0.3

info:
  title: Core Retail Ledger & Balance Mutation Engine API
  description: |
    Comprehensive OpenAPI specification for the Capstone Banking System.

    This multi-service banking platform provides:

    - Customer onboarding
    - BCrypt credential verification
    - JWT-based authentication
    - JWT-based authentication
    - JWT revocation through Redis
    - Multi-currency bank account management
    - Atomic balance mutations
    - DEPOSIT, WITHDRAWAL, and TRANSFER transactions
    - Cross-currency transfers using Foreign Exchange rates
    - Pessimistic row locking for balance mutations
    - Idempotent transaction processing
    - Append-only PostgreSQL ledger audit trail
    - Kafka event publishing through the outbox pattern
    - Admin account governance
    - Admin customer lookup
    - Transaction and ledger reconciliation
    - Reconciliation break detection

    Main request flow:

      Client
        |
        v
      API Gateway :8080
        |
        +--> Authentication Services
        |
        +--> Accounts Service
        |
        +--> Transaction Service
        |
        +--> FX Service
        |
        +--> Reconciliation Service

    The API Gateway is the primary external entry point. Direct service
    servers are documented for development, troubleshooting, and internal
    service testing.

  version: 1.0.0

  contact:
    name: Capstone Banking Engineering Team
    email: dev@capstone.bank

servers:
  - url: http://localhost:8080
    description: |
      API Gateway - primary API entry point.
      Performs JWT validation, Redis token blacklist checking, and routing.

  - url: http://localhost:8081
    description: Registration Service - direct development access.

  - url: http://localhost:8082
    description: Login Service - direct development access.

  - url: http://localhost:8083
    description: Accounts Service - direct development access.

  - url: http://localhost:8084
    description: Transaction Service - direct development access.

  - url: http://localhost:8086
    description: Reconciliation Service - direct development access.

  - url: http://localhost:8087
    description: Foreign Exchange Service - direct development access.

tags:
  - name: Authentication
    description: |
      Customer registration, credential verification, JWT issuance,
      and JWT revocation.

  - name: Accounts
    description: |
      Customer account provisioning, account lookup, balance inquiry,
      and internal debit/credit balance mutations.

  - name: Ledger & Transactions
    description: |
      Core banking transaction processing and immutable ledger audit.
      Supports DEPOSIT, WITHDRAWAL, TRANSFER, idempotency, pessimistic
      locking, and cross-currency transaction processing.

  - name: Foreign Exchange
    description: |
      Foreign exchange rate lookup and cached FX-rate listing.

  - name: Admin — Accounts
    description: |
      Administrative account governance including account listing,
      freezing, unfreezing, and closing.

  - name: Admin — Customers
    description: |
      Administrative customer directory and individual customer lookup.

  - name: Reconciliation
    description: |
      Transaction-to-ledger consistency checking, reconciliation runs,
      reconciliation results, and open break monitoring.

paths:
  # =====================================================================
  # AUTHENTICATION
  # =====================================================================

  /api/auth/register:
    post:
      tags:
        - Authentication

      summary: Register a new customer

      description: |
        Creates a new customer and corresponding application credentials.

        Processing:

        1. Validates the registration request.
        2. Creates a CUSTOMER_MASTER record.
        3. Creates an APP_USER_MASTER record.
        4. Stores the password using BCrypt hashing.
        5. Commits customer and credential creation atomically.
        6. Publishes a customer.registered event through Kafka.

        This endpoint does not require authentication.

        Example request:

          POST /api/auth/register

        Example payload:

          {
            "firstName": "Alice",
            "lastName": "Reyes",
            "email": "alice.reyes@example.com",
            "contactNo": "+63-917-555-0100",
            "birthDate": "1990-04-12",
            "password": "StrongPass123!"
          }

        After successful registration, the customer can authenticate
        using POST /api/auth/login.

      operationId: registerCustomer

      security: []

      requestBody:
        required: true
        description: Customer registration information.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              firstName: "Alice"
              lastName: "Reyes"
              email: "alice.reyes@example.com"
              contactNo: "+63-917-555-0100"
              birthDate: "1990-04-12"
              password: "StrongPass123!"
              role: "ROLE_CUSTOMER"

      responses:
        "201":
          description: Customer registered successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterApiResponse"
              example:
                success: true
                message: "Customer registered successfully"
                data:
                  customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  firstName: "Alice"
                  lastName: "Reyes"
                  email: "alice.reyes@example.com"
                timestamp: "2026-09-28T15:00:00+08:00"

        "400":
          description: Validation error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Validation failed for field 'email'"
                instance: "/api/auth/register"
                timestamp: "2026-09-28T15:00:00+08:00"
                fieldErrors:
                  email: "Email must be a valid address"

        "409":
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Conflict"
                status: 409
                detail: "Email is already registered"
                instance: "/api/auth/register"
                timestamp: "2026-09-28T15:00:00+08:00"

        "500":
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/auth/login:
    post:
      tags:
        - Authentication

      summary: Authenticate a customer and receive a JWT

      description: |
        Authenticates a registered customer.

        Processing:

        1. Looks up the application user by email.
        2. Verifies the supplied password against the BCrypt hash.
        3. Verifies that the customer is active.
        4. Generates a signed HMAC-SHA256 JWT.
        5. Registers the active token in Redis.
        6. Returns the JWT and customer information.

        This endpoint does not require authentication.

        Example request:

          POST /api/auth/login

          {
            "email": "alice.reyes@example.com",
            "password": "StrongPass123!"
          }

        The returned JWT must be sent with protected endpoints:

          Authorization: Bearer <JWT>

      operationId: login

      security: []

      requestBody:
        required: true
        description: Customer login credentials.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "alice.reyes@example.com"
              password: "StrongPass123!"

      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
              example:
                success: true
                message: "Login successful"
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  tokenType: "Bearer"
                  expiresInSeconds: 3600
                  customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  email: "alice.reyes@example.com"
                  role: "ROLE_CUSTOMER"
                timestamp: "2026-09-28T15:01:00+08:00"

        "400":
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Email and password are required"
                instance: "/api/auth/login"
                timestamp: "2026-09-28T15:01:00+08:00"

        "401":
          description: Invalid credentials or inactive customer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Unauthorized"
                status: 401
                detail: "Invalid email or password"
                instance: "/api/auth/login"
                timestamp: "2026-09-28T15:01:00+08:00"

  /api/auth/logout:
    post:
      tags:
        - Authentication

      summary: Invalidate the current JWT

      description: |
        Revokes the currently authenticated JWT.

        The JWT is added to the Redis token blacklist. Subsequent requests
        using the same token are rejected by the API Gateway.

        Example:

          POST /api/auth/logout

          Authorization: Bearer eyJhbGciOiJIUzI1NiIs...

      operationId: logout

      security:
        - BearerAuth: []

      parameters:
        - name: Authorization
          in: header
          required: true
          description: |
            JWT to revoke.

            Format:
              Bearer <JWT>
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiJ9..."

      responses:
        "200":
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidApiResponse"
              example:
                success: true
                message: "Logout successful"
                data: null
                timestamp: "2026-09-28T15:05:00+08:00"

        "400":
          description: Authorization header is missing or malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Token is missing or expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # =====================================================================
  # ACCOUNTS
  # =====================================================================

  /api/accounts:
    post:
      tags:
        - Accounts

      summary: Create a new bank account

      description: |
        Creates a new customer bank account in CUSTOMER_BALANCE_MASTER.

        The customer must already exist.

        New accounts are initialized with:

        - Balance: 0.0000
        - Status: ACTIVE
        - Account type: SAVINGS, CHECKING, or WALLET
        - Currency: ISO 4217 three-letter code

        An account.created event is published through the configured
        outbox/Kafka flow.

        Example:

          POST /api/accounts

          {
            "customerId": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
            "accountType": "SAVINGS",
            "currencyCode": "PHP"
          }

      operationId: createAccount

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            example:
              customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              accountType: "SAVINGS"
              currencyCode: "PHP"

      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApiResponse"
              example:
                success: true
                message: "Account created"
                data:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  accountType: "SAVINGS"
                  accountStatus: "ACTIVE"
                  balanceAmount: 0.0000
                  currencyCode: "PHP"
                  createdAt: "2026-09-28T15:10:00+08:00"
                timestamp: "2026-09-28T15:10:00+08:00"

        "400":
          description: Validation error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Customer does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/accounts/{accountId}:
    get:
      tags:
        - Accounts

      summary: Get account details

      description: |
        Retrieves complete information for one bank account.

        Example:

          GET /api/accounts/a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d

      operationId: getAccountById

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AccountId"

      responses:
        "200":
          description: Account details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApiResponse"
              example:
                success: true
                message: "OK"
                data:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  accountType: "SAVINGS"
                  accountStatus: "ACTIVE"
                  balanceAmount: 10000.0000
                  currencyCode: "PHP"
                  createdAt: "2026-09-28T15:10:00+08:00"
                timestamp: "2026-09-28T15:15:00+08:00"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/accounts/{accountId}/balance:
    get:
      tags:
        - Accounts

      summary: Get current account balance

      description: |
        Retrieves the current account balance.

        The service attempts to read the balance from Redis first.
        If no cached value exists, the service reads the balance from
        CUSTOMER_BALANCE_MASTER.

        Example:

          GET /api/accounts/a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d/balance

        Example result:

          {
            "success": true,
            "message": "OK",
            "data": 10000.0000
          }

      operationId: getAccountBalance

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AccountId"

      responses:
        "200":
          description: Current balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceApiResponse"
              example:
                success: true
                message: "OK"
                data: 10000.0000
                timestamp: "2026-09-28T15:16:00+08:00"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/accounts/customer/{customerId}:
    get:
      tags:
        - Accounts

      summary: List all accounts for a customer

      description: |
        Returns every account belonging to a specific customer.

        Example:

          GET /api/accounts/customer/3fa85f64-5717-4562-b3fc-2c963f66afa6

        The response can contain multiple accounts with different account
        types and currencies.

      operationId: getAccountsForCustomer

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/CustomerId"

      responses:
        "200":
          description: Customer account list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListApiResponse"
              example:
                success: true
                message: "OK"
                data:
                  - accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                    customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    accountType: "SAVINGS"
                    accountStatus: "ACTIVE"
                    balanceAmount: 10000.0000
                    currencyCode: "PHP"
                    createdAt: "2026-09-28T15:10:00+08:00"
                  - accountId: "b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e"
                    customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    accountType: "WALLET"
                    accountStatus: "ACTIVE"
                    balanceAmount: 2500.0000
                    currencyCode: "USD"
                    createdAt: "2026-09-28T15:12:00+08:00"
                timestamp: "2026-09-28T15:16:00+08:00"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/accounts/{accountId}/debit:
    post:
      tags:
        - Accounts

      summary: Debit an account

      description: |
        Internal account mutation endpoint used primarily by Transaction Service.

        Processing:

        1. Acquires a pessimistic write lock on CUSTOMER_BALANCE_MASTER.
        2. Validates that the account exists.
        3. Validates that the account status is ACTIVE.
        4. Validates that sufficient balance exists.
        5. Debits the requested amount.
        6. Invalidates the Redis balance cache.

        This endpoint is normally invoked as part of a WITHDRAWAL or
        TRANSFER transaction.

        Example:

          POST /api/accounts/a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d/debit

          {
            "amount": 500.0000,
            "txnId": "c2a85f64-5717-4562-b3fc-2c963f66afa7",
            "txnType": "WITHDRAWAL"
          }

      operationId: debitAccount

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AccountId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountMutationRequest"
            example:
              amount: 500.0000
              txnId: "c2a85f64-5717-4562-b3fc-2c963f66afa7"
              txnType: "WITHDRAWAL"

      responses:
        "200":
          description: Account debited successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMutationApiResponse"
              example:
                success: true
                message: "Debit processed"
                data:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  balanceBefore: 10000.0000
                  balanceAfter: 9500.0000
                  appliedDelta: -500.0000
                  currencyCode: "PHP"
                timestamp: "2026-09-28T15:20:00+08:00"

        "400":
          description: Invalid mutation request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "409":
          description: Account is FROZEN or CLOSED.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "422":
          description: Insufficient account balance.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/accounts/{accountId}/credit:
    post:
      tags:
        - Accounts

      summary: Credit an account

      description: |
        Internal account mutation endpoint used primarily by Transaction Service.

        Processing:

        1. Acquires a pessimistic write lock.
        2. Validates that the account exists.
        3. Validates that the account status is ACTIVE.
        4. Adds the requested amount to the account balance.
        5. Invalidates the Redis balance cache.

        This endpoint is normally invoked for DEPOSIT or TRANSFER operations.

        Example:

          POST /api/accounts/{accountId}/credit

          {
            "amount": 1000.0000,
            "txnId": "c2a85f64-5717-4562-b3fc-2c963f66afa7",
            "txnType": "DEPOSIT"
          }

      operationId: creditAccount

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AccountId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountMutationRequest"
            example:
              amount: 1000.0000
              txnId: "c2a85f64-5717-4562-b3fc-2c963f66afa7"
              txnType: "DEPOSIT"

      responses:
        "200":
          description: Account credited successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMutationApiResponse"
              example:
                success: true
                message: "Credit processed"
                data:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  balanceBefore: 9000.0000
                  balanceAfter: 10000.0000
                  appliedDelta: 1000.0000
                  currencyCode: "PHP"
                timestamp: "2026-09-28T15:20:00+08:00"

        "400":
          description: Invalid mutation request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "409":
          description: Account is FROZEN or CLOSED.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # =====================================================================
  # LEDGER AND TRANSACTIONS
  # =====================================================================

  /api/v1/ledger/mutate:
    post:
      tags:
        - Ledger & Transactions

      summary: Execute a DEPOSIT, WITHDRAWAL, or TRANSFER

      description: |
        Main banking transaction endpoint.

        Supported transaction types:

        DEPOSIT:
          Credits the specified account.

          Accounts affected:
            - accountId: CREDIT

          Ledger entries:
            - 1 CREDIT entry

        WITHDRAWAL:
          Debits the specified account.

          Accounts affected:
            - accountId: DEBIT

          Ledger entries:
            - 1 DEBIT entry

        TRANSFER:
          Debits the source account and credits the counterparty account.

          Accounts affected:
            - accountId: DEBIT
            - counterpartyAccountId: CREDIT

          Ledger entries:
            - 1 DEBIT entry
            - 1 CREDIT entry

        Processing flow:

        1. TransactionIdInterceptor generates a transaction UUID.
        2. Idempotency key is checked in Redis.
        3. Source and destination accounts are validated.
        4. Oracle balance rows are pessimistically locked.
        5. Balance validation is performed.
        6. CUSTOMER_BALANCE_MASTER is updated.
        7. TRANSACTION_MASTER is created with PENDING status.
        8. PostgreSQL LEDGER_MUTATION_AUDIT entries are written.
        9. Transaction is marked COMMITTED.
        10. Redis balance cache is invalidated.
        11. transaction.completed is published through the outbox/Kafka flow.

        If the PostgreSQL ledger phase fails, the Oracle mutation is compensated
        and the transaction is marked ROLLED_BACK.

        IMPORTANT:
        The client must NOT send txnId in the request body.
        TransactionIdInterceptor generates it automatically.

        Idempotency example:

          First request:
            idempotencyKey = "deposit-acct1-5000-001"

          Repeated request with the same key:
            The existing transaction result is returned instead of applying
            the balance mutation again.

      operationId: mutateBalance

      security:
        - BearerAuth: []

      requestBody:
        required: true
        description: Transaction request. txnId is generated server-side.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"

            examples:
              deposit:
                summary: Deposit PHP 5,000
                value:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  txnType: "DEPOSIT"
                  amount: 5000.0000
                  idempotencyKey: "deposit-acct1-5000-001"

              withdrawal:
                summary: Withdraw PHP 1,000
                value:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  txnType: "WITHDRAWAL"
                  amount: 1000.0000
                  idempotencyKey: "withdraw-acct1-1000-001"

              transfer:
                summary: Transfer PHP 2,500
                value:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  counterpartyAccountId: "b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e"
                  txnType: "TRANSFER"
                  amount: 2500.0000
                  idempotencyKey: "transfer-acct1-acct2-2500-001"

              crossCurrencyTransfer:
                summary: Cross-currency PHP to USD transfer
                value:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  counterpartyAccountId: "b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e"
                  txnType: "TRANSFER"
                  amount: 5850.0000
