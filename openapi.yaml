  /api/admin/accounts/{accountId}/status:
    patch:
      tags:
        - Admin — Accounts

      summary: Update account status

      description: |
        Changes the administrative status of an account.

        Supported states:

        ACTIVE:
          Account can perform normal mutations.

        FROZEN:
          Account remains available for inquiry but balance mutations
          are rejected.

        CLOSED:
          Account is permanently closed and cannot be reopened through
          this endpoint.

        Example:

          PATCH /api/admin/accounts/a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d/status?status=FROZEN

        Requires ROLE_ADMIN.

      operationId: adminUpdateAccountStatus

      security:
        - BearerAuth: []

      parameters:
        - $ref: "#/components/parameters/AccountId"

        - name: status
          in: query
          required: true
          description: New account status.
          schema:
            type: string
            enum:
              - ACTIVE
              - FROZEN
              - CLOSED
            example: "FROZEN"

      responses:
        "200":
          description: Account status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApiResponse"
              example:
                success: true
                message: "Account status updated"
                data:
                  accountId: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                  customerId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  accountType: "SAVINGS"
                  accountStatus: "FROZEN"
                  balanceAmount: 10000.0000
                  currencyCode: "PHP"
                  createdAt: "2026-09-28T15:10:00+08:00"
                timestamp: "2026-09-28T15:31:00+08:00"

        "400":
          description: Invalid account status.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "403":
          description: Caller does not have ROLE_ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "404":
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

