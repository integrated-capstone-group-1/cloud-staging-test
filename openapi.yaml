  # =====================================================================
  # FOREIGN EXCHANGE
  # =====================================================================

  /api/v1/fx-rate:
    get:
      tags:
        - Foreign Exchange

      summary: Get an exchange rate between two currencies

      description: |
        Resolves the exchange rate between sourceCurrency and targetCurrency.

        The service can use a cached direct rate or calculate a cross-currency
        rate through the configured USD pivot.

        Example:

          GET /api/v1/fx-rate?sourceCurrency=PHP&targetCurrency=USD

        Example result:

          PHP -> USD
          1 PHP = 0.01709402 USD

        This rate can subsequently be used for a cross-currency transfer.

      operationId: getFxRate

      security:
        - BearerAuth: []

      parameters:
        - name: sourceCurrency
          in: query
          required: true
          description: ISO 4217 source currency code.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            example: "PHP"

        - name: targetCurrency
          in: query
          required: true
          description: ISO 4217 destination currency code.
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            example: "USD"

      responses:
        "200":
          description: Exchange rate resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRateResponse"
              example:
                sourceCurrency: "PHP"
                targetCurrency: "USD"
                exchangeRate: 0.01709402
                isCrossCurrency: true

        "400":
          description: Missing, unsupported, or malformed currency code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/forex/rates:
    get:
      tags:
        - Foreign Exchange

      summary: List all cached exchange rates

      description: |
        Returns the exchange rates currently stored in the FX rate cache.

        Example:

          GET /api/v1/forex/rates

        This endpoint is useful for frontend currency selectors,
        exchange-rate displays, and diagnostic purposes.

      operationId: getAllRates

      security:
        - BearerAuth: []

      responses:
        "200":
          description: Cached FX rate list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FxRateCache"
              example:
                - id: 1
                  baseCurrency: "USD"
                  targetCurrency: "PHP"
                  rate: 58.5200000000000000
                  fetchedAt: "2026-09-28T15:00:00+08:00"
                - id: 2
                  baseCurrency: "USD"
                  targetCurrency: "EUR"
                  rate: 0.8520000000000000
                  fetchedAt: "2026-09-28T15:00:00+08:00"

        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

