  /api/v1/ledger/audit/{txnId}:
    get:
      tags:
        - Ledger & Transactions

      summary: Retrieve the ledger audit trail for a transaction

      description: |
        Retrieves the immutable ledger audit entries stored in
        LEDGER_MUTATION_AUDIT for a transaction.

        Expected entries:

        DEPOSIT:
          1 CREDIT entry

        WITHDRAWAL:
          1 DEBIT entry

        TRANSFER:
          1 DEBIT entry for the source account
          1 CREDIT entry for the destination account

        Example:

          GET /api/v1/ledger/audit/7c9e6679-7425-40de-944b-e07fc1f90ae7

      operationId: getAuditByTxnId

      security:
        - BearerAuth: []

      parameters:
        - name: txnId
          in: path
          required: true
          description: UUID generated for the transaction.
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"

      responses:
        "200":
          description: Ledger audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListApiResponse"
              example:
                success: true
