        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:16:00+08:00"

    AccountMutationApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "Debit processed"

        data:
          $ref: "#/components/schemas/AccountMutationResponse"

        timestamp:
          type: string
          format: date-time
          example: "2026-09-28T15:20:00+08:00"

    TransactionApiResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        message:
          type: string
          example: "TRANSFER processed"

        data:
          $ref: "#/components/schemas/TransactionResponse"

