apiVersion: 1

datasources:
  # ── Prometheus — metrics datasource ─────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "10s"
      httpMethod: POST

  # ── Loki — log datasource ────────────────────────────────────────────────────
  # Grafana connects to Loki via the internal Docker network (loki:3100).
  # The uid 'loki' is referenced by the Application Logs dashboard panels
  # so the datasource name and uid must not be changed without also updating
  # grafana/provisioning/dashboards/application-logs.json.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      # Maximum number of lines to return per query (prevents browser overload)
      maxLines: 1000
      # Derive labels from log fields for filtering in Explore
      derivedFields:
        - name: transactionId
          matcherRegex: "transactionId=([\\w-]+)"
          url: ""
          datasourceUid: loki
