networks:
  banking-net:
    driver: bridge

volumes:
  oracle-data:
  postgres-data:
  loki-data:
  promtail-positions:

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: OraclePass123
      APP_USER: ledger_app
      APP_USER_PASSWORD: LedgerAppPass123
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/oracle:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - banking-net

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: ledger_audit
      POSTGRES_USER: ledger_audit
      POSTGRES_PASSWORD: LedgerAuditPass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_audit -d ledger_audit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - banking-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - banking-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - banking-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking-net

  # ── Application services ────────────────────────────────────────────────────
  # Each service carries the Docker label 'banking.service=true' so that
  # Promtail's Docker SD filter picks up its logs automatically.

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      registration-service:
        condition: service_started
      login-service:
        condition: service_started
      accounts-service:
        condition: service_started
      transaction-service:
        condition: service_started
      forex-service:
        condition: service_started
      reconciliation-service:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  registration-service:
    build:
      context: .
      dockerfile: registration-service/Dockerfile
    container_name: registration-service
    depends_on:
      oracle-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      ORACLE_USERNAME: ledger_app
      ORACLE_PASSWORD: LedgerAppPass123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  login-service:
    build:
      context: .
      dockerfile: login-service/Dockerfile
    container_name: login-service
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      ORACLE_USERNAME: ledger_app
      ORACLE_PASSWORD: LedgerAppPass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    container_name: accounts-service
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      ORACLE_USERNAME: ledger_app
      ORACLE_PASSWORD: LedgerAppPass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    depends_on:
      oracle-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      accounts-service:
        condition: service_started
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      ORACLE_USERNAME: ledger_app
      ORACLE_PASSWORD: LedgerAppPass123
      POSTGRES_URL: jdbc:postgresql://postgres-db:5432/ledger_audit
      POSTGRES_USERNAME: ledger_audit
      POSTGRES_PASSWORD: LedgerAuditPass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNTS_SERVICE_URL: http://accounts-service:8083
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      # Activates the 'docker' Spring profile → JSON logging for Loki ingestion
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_started
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-db:5432/ledger_audit
      POSTGRES_USERNAME: ledger_audit
      POSTGRES_PASSWORD: LedgerAuditPass123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  forex-service:
    build:
      context: .
      dockerfile: forex-service/Dockerfile
    container_name: forex-service
    ports:
      - "8087:8087"
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-db:5432/ledger_audit
      POSTGRES_USERNAME: ledger_audit
      POSTGRES_PASSWORD: LedgerAuditPass123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  frontend-web:
    build:
      context: .
      dockerfile: frontend-web/Dockerfile
    container_name: frontend-web
    ports:
      - "8090:8090"
    depends_on:
      - api-gateway
    environment:
      BANKING_BACKEND_MODE: gateway
      BANKING_GATEWAY_URL: http://api-gateway:8080
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  reconciliation-service:
    build:
      context: .
      dockerfile: reconciliation-service/Dockerfile
    container_name: reconciliation-service
    ports:
      - "8086:8086"
    depends_on:
      oracle-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      ORACLE_USERNAME: ledger_app
      ORACLE_PASSWORD: LedgerAppPass123
      ORACLE_SCHEMA: LEDGER_APP
      POSTGRES_URL: jdbc:postgresql://postgres-db:5432/ledger_audit
      POSTGRES_USERNAME: ledger_audit
      POSTGRES_PASSWORD: LedgerAuditPass123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
      SPRING_PROFILES_ACTIVE: docker
    labels:
      banking.service: "true"
    networks:
      - banking-net

  # ── Observability infrastructure ────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - banking-net

  # ── Loki — centralised log aggregation ──────────────────────────────────────
  # Single-binary mode with filesystem storage.
  # Data persisted in the named volume 'loki-data' so logs survive restarts.
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-net

  # ── Promtail — log collector / shipper ──────────────────────────────────────
  # Reads Docker container logs via the Docker socket and ships them to Loki.
  # /var/lib/docker/containers is mounted read-only for log file access.
  # /var/run/docker.sock is mounted for Docker SD (service discovery).
  # promtail-positions volume persists read offsets across Promtail restarts so
  # logs are not re-ingested from the beginning each time Promtail is restarted.
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail:/etc/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-positions:/promtail-positions
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - banking-net

  # ── Grafana — dashboards and visualisation ──────────────────────────────────
  # Datasources (Prometheus + Loki) and dashboards are provisioned automatically
  # from grafana/provisioning/ — no manual configuration required.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Allow Grafana to load unsigned plugins if needed in future
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=
      # Increase default query timeout for Loki log range queries
      - GF_DATAPROXY_TIMEOUT=60
    networks:
      - banking-net
    depends_on:
      - prometheus
      - loki
