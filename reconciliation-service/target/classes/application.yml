server:
  port: 8086

spring:
  application:
    name: reconciliation-service

  # ---------------------------------------------------------------
  # Two independent datasources — neither owned by this service.
  # Both databases are pre-provisioned by the SQL init scripts.
  # Hibernate is ddl-auto: validate on both sides — read-only
  # reconciliation, never creates or alters tables.
  # ---------------------------------------------------------------
  oracle:
    datasource:
      jdbc-url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
      username: ${ORACLE_USERNAME:ledger_app}
      password: ${ORACLE_PASSWORD:LedgerAppPass123}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: recon-oracle-pool
        maximum-pool-size: 5
        read-only: true

  postgres:
    datasource:
      jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit}
      username: ${POSTGRES_USERNAME:ledger_audit}
      password: ${POSTGRES_PASSWORD:LedgerAuditPass123}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: recon-postgres-pool
        maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest

recon:
  schedule-cron: ${RECON_SCHEDULE_CRON:0 */15 * * * *}
  topics:
    discrepancy: reconciliation.discrepancy
    run-completed: reconciliation.run.completed
  matching:
    amount-tolerance: 0.0000
    late-posting-threshold-seconds: 300
  outbox-relay:
    poll-fixed-delay-ms: 2000
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      service: reconciliation-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
