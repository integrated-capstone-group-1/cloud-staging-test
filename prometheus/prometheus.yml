global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "registration-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["registration-service:8081"]

  - job_name: "login-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["login-service:8082"]

  - job_name: "accounts-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["accounts-service:8083"]

  - job_name: "transaction-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["transaction-service:8084"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8085"]

  - job_name: "reconciliation-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["reconciliation-service:8086"]

  - job_name: "forex-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["forex-service:8087"]
