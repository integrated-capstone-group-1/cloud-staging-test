<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Open New Account')}"></head>
<body>
<div th:replace="~{fragments/layout :: demoBar}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2"><i class="bi bi-wallet-fill"></i></div>
                    <h3 class="fw-bold mb-1">Open a New Account</h3>
                    <p class="text-muted small">Expand your banking portfolio with multi-currency deposits or digital wallets</p>
                </div>

                <form th:action="@{/accounts/open}" th:object="${openAccountForm}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Select Account Type</label>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="form-check card p-3 h-100 cursor-pointer">
                                    <input class="form-check-input" type="radio" th:field="*{accountType}" value="SAVINGS" id="typeSavings" checked>
                                    <label class="form-check-label fw-bold mt-1" for="typeSavings">
                                        Savings Account
                                        <div class="text-muted small fw-normal">Interest-bearing retail deposit with standard ledger rules.</div>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check card p-3 h-100 cursor-pointer">
                                    <input class="form-check-input" type="radio" th:field="*{accountType}" value="CHECKING" id="typeChecking">
                                    <label class="form-check-label fw-bold mt-1" for="typeChecking">
                                        Checking Account
                                        <div class="text-muted small fw-normal">Day-to-day transactional account for high-frequency transfers.</div>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check card p-3 h-100 cursor-pointer">
                                    <input class="form-check-input" type="radio" th:field="*{accountType}" value="WALLET" id="typeWallet">
                                    <label class="form-check-label fw-bold mt-1" for="typeWallet">
                                        Digital Wallet
                                        <div class="text-muted small fw-normal">Instant digital payments and peer-to-peer balance mutations.</div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Base Currency</label>
                        <select class="form-select" th:field="*{currencyCode}">
                            <option value="PHP">PHP — Philippine Peso (₱)</option>
                            <option value="USD">USD — US Dollar ($)</option>
                            <option value="EUR">EUR — Euro (€)</option>
                            <option value="GBP">GBP — British Pound (£)</option>
                            <option value="SGD">SGD — Singapore Dollar (S$)</option>
                        </select>
                        <div class="form-text small">Multi-currency ledger accounts allow cross-currency transfers via ForEx Service.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Initial Opening Deposit (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-cash-stack"></i></span>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{initialDeposit}" placeholder="0.00"/>
                        </div>
                        <div class="form-text small">Opening balance credited immediately upon provisioning.</div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="/customer/dashboard" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i> Confirm &amp; Open Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<button
    type="button"
    class="app-theme-toggle"
    id="appThemeToggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode">

    <i class="bi bi-moon-fill" id="appThemeIcon"></i>

</button>

<script>
(function () {

    const body = document.body;
    const toggle = document.getElementById("appThemeToggle");
    const icon = document.getElementById("appThemeIcon");

    if (!toggle || !icon) {
        return;
    }

    const savedTheme = localStorage.getItem("banking-theme");

    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
    }

    function updateIcon() {

        if (body.classList.contains("dark-mode")) {

            icon.className = "bi bi-sun-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to light mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to light mode"
            );

        } else {

            icon.className = "bi bi-moon-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to dark mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to dark mode"
            );
        }
    }

    updateIcon();

    toggle.addEventListener("click", function () {

        body.classList.toggle("dark-mode");

        const isDark =
            body.classList.contains("dark-mode");

        localStorage.setItem(
            "banking-theme",
            isDark ? "dark" : "light"
        );

        updateIcon();
    });

})();
</script>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
