<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer Account Portfolio')}"></head>
<body>
<div th:replace="~{fragments/layout :: demoBar}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <!-- Customer Info Card -->
    <div class="card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h3 class="fw-bold mb-1" th:text="${customer.fullName}">Customer Name</h3>
                <div class="text-muted small">
                    Customer ID: <strong class="font-monospace" th:text="${customer.customerId}">CUST-1001</strong> ·
                    Member since <span th:text="${#temporals.format(customer.createdAt, 'dd MMM yyyy')}">01 Jan 2026</span>
                </div>
            </div>
            <div>
                <span th:class="${'badge fs-6 ' + (customer.kycStatus.name() == 'VERIFIED' ? 'badge-kyc-verified' : 'badge-kyc-pending')}"
                      th:text="${customer.kycStatus.displayName}">VERIFIED</span>
            </div>
        </div>

        <div class="row g-3 text-muted small border-top pt-3">
            <div class="col-md-3"><strong>Email:</strong> <span th:text="${customer.email}"></span></div>
            <div class="col-md-3"><strong>Phone:</strong> <span th:text="${customer.contactNo}"></span></div>
            <div class="col-md-3"><strong>ID Doc:</strong> <span th:text="${customer.idType + ' (' + customer.idNumber + ')'}"></span></div>
            <div class="col-md-3"><strong>Portfolio Value:</strong> <span class="fw-bold text-dark" th:text="${'₱' + #numbers.formatDecimal(totalBalanceInPhp, 1, 'COMMA', 2, 'POINT')}"></span></div>
        </div>
    </div>

    <!-- Accounts Section Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-wallet2 text-primary me-2"></i>Accounts Portfolio (<span th:text="${accounts.size()}"></span>)</h5>
        <a href="/accounts/open" class="btn btn-sm btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Open New Account
        </a>
    </div>

    <!-- Accounts Grid -->
    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="a : ${accounts}">
            <div class="card p-3 card-hover h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="currency-badge" th:text="${a.currencyCode}">PHP</span>
                        <span class="badge" th:classappend="${a.accountStatus.name() == 'ACTIVE'} ? 'bg-success' : 'bg-warning'"
                              th:text="${a.accountStatus.displayName}">ACTIVE</span>
                    </div>
                    <div class="text-muted small" th:text="${a.accountType.displayName}">Account Type</div>
                    <div class="balance-figure my-1" th:text="${a.formattedBalance}">₱0.00</div>
                    <div class="text-muted small font-monospace" th:text="${a.accountId}">ACCT-1001</div>
                </div>

                <div class="mt-3 pt-3 border-top d-flex gap-2">
                    <a th:href="@{/accounts/{no}(no=${a.accountId})}" class="btn btn-sm btn-outline-secondary w-50">
                        <i class="bi bi-list-ul me-1"></i> Details
                    </a>
                    <a th:href="@{/transactions/new(fromAcctNo=${a.accountId})}" class="btn btn-sm btn-primary w-50">
                        <i class="bi bi-arrow-right-circle me-1"></i> Transact
                    </a>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(accounts)}">
            <div class="card p-4 text-center text-muted">
                No accounts open for this customer yet.
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<button
    type="button"
    class="app-theme-toggle"
    id="appThemeToggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode">

    <i class="bi bi-moon-fill" id="appThemeIcon"></i>

</button>

<script>
(function () {

    const body = document.body;
    const toggle = document.getElementById("appThemeToggle");
    const icon = document.getElementById("appThemeIcon");

    if (!toggle || !icon) {
        return;
    }

    const savedTheme = localStorage.getItem("banking-theme");

    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
    }

    function updateIcon() {

        if (body.classList.contains("dark-mode")) {

            icon.className = "bi bi-sun-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to light mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to light mode"
            );

        } else {

            icon.className = "bi bi-moon-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to dark mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to dark mode"
            );
        }
    }

    updateIcon();

    toggle.addEventListener("click", function () {

        body.classList.toggle("dark-mode");

        const isDark =
            body.classList.contains("dark-mode");

        localStorage.setItem(
            "banking-theme",
            isDark ? "dark" : "light"
        );

        updateIcon();
    });

})();
</script>
</body>
</html>
