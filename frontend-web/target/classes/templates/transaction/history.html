<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ledger &amp; Audit Trail')}"></head>
<body>
<div th:replace="~{fragments/layout :: demoBar}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h4 class="fw-bold mb-1"><i class="bi bi-journal-text text-primary me-2"></i>Ledger &amp; Mutation Audit Trail</h4>
            <p class="text-muted small mb-0">Append-only audit mutations matching LEDGER_MUTATION_AUDIT</p>
        </div>
        <div class="d-flex gap-2">
            <input type="text" id="ledgerSearch" class="form-control form-control-sm" placeholder="Search account, Txn ID..." onkeyup="filterLedger()">
            <a href="/transactions/new" class="btn btn-sm btn-primary text-nowrap">
                <i class="bi bi-plus-lg me-1"></i> New Mutation
            </a>
        </div>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-sm table-hover" id="ledgerTable">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Transaction ID</th>
                        <th>Mutation ID</th>
                        <th>Account ID</th>
                        <th>Counterparty</th>
                        <th>Type</th>
                        <th>Direction</th>
                        <th>Amount</th>
                        <th>Audit State</th>
                        <th>Receipt</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${transactions}">
                        <td class="small" th:text="${#temporals.format(t.timestamp, 'dd MMM yyyy HH:mm:ss')}"></td>
                        <td class="font-monospace small fw-semibold" th:text="${t.txnId}"></td>
                        <td class="font-monospace small text-muted" th:text="${t.mutationId}"></td>
                        <td>
                            <a th:href="@{/accounts/{id}(id=${t.accountId})}" class="font-monospace small text-decoration-none" th:text="${t.accountId}"></a>
                        </td>
                        <td class="font-monospace small text-muted" th:text="${t.counterpartyAccountId != null ? t.counterpartyAccountId : '—'}"></td>
                        <td>
                            <span class="badge" th:classappend="${t.txnType.badgeClass}" th:text="${t.txnType.displayName}">TRANSFER</span>
                            <span th:if="${t.crossCurrency}" class="badge bg-warning-subtle text-warning border small" title="ForEx Cross Currency">FX</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${t.direction.name() == 'CREDIT'} ? 'badge-credit' : 'badge-debit'"
                                  th:text="${t.direction.name()}"></span>
                        </td>
                        <td class="fw-bold" th:classappend="${t.direction.name() == 'CREDIT'} ? 'text-success' : 'text-danger'"
                            th:text="${t.formattedAmount}"></td>
                        <td>
                            <span class="badge bg-success-subtle text-success border border-success-subtle small"
                                  th:text="${t.auditState}">COMMITTED</span>
                        </td>
                        <td>
                            <a th:href="@{/transactions/receipt/{id}(id=${t.txnId})}" class="btn btn-sm btn-outline-secondary py-0 px-2" title="View receipt">
                                <i class="bi bi-receipt"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="10" class="text-center text-muted py-4">No ledger transaction mutations recorded yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
function filterLedger() {
    const query = document.getElementById('ledgerSearch').value.toLowerCase();
    const rows = document.querySelectorAll('#ledgerTable tbody tr');
    rows.forEach(r => {
        const text = r.textContent.toLowerCase();
        r.style.display = text.includes(query) ? '' : 'none';
    });
}
</script>
<button
    type="button"
    class="app-theme-toggle"
    id="appThemeToggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode">

    <i class="bi bi-moon-fill" id="appThemeIcon"></i>

</button>

<script>
(function () {

    const body = document.body;
    const toggle = document.getElementById("appThemeToggle");
    const icon = document.getElementById("appThemeIcon");

    if (!toggle || !icon) {
        return;
    }

    const savedTheme = localStorage.getItem("banking-theme");

    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
    }

    function updateIcon() {

        if (body.classList.contains("dark-mode")) {

            icon.className = "bi bi-sun-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to light mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to light mode"
            );

        } else {

            icon.className = "bi bi-moon-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to dark mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to dark mode"
            );
        }
    }

    updateIcon();

    toggle.addEventListener("click", function () {

        body.classList.toggle("dark-mode");

        const isDark =
            body.classList.contains("dark-mode");

        localStorage.setItem(
            "banking-theme",
            isDark ? "dark" : "light"
        );

        updateIcon();
    });

})();
</script>

</body>
</html>
