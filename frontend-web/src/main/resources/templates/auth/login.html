<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Sign In')}"></head>

<body class="banking-login">

<div th:replace="~{fragments/layout :: demoBar}"></div>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">

    <div class="card auth-card p-4 p-md-5">

        <!-- LOGIN HEADER -->
        <div class="text-center mb-4">

            <div class="login-icon mb-2">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h3 class="fw-bold mb-1">
                Account Sign In
            </h3>

            <p class="text-muted small mb-0">
                Access your accounts and banking ledger
            </p>

        </div>

        <!-- LOGIN FORM -->
        <form th:action="@{/login}"
              th:object="${loginForm}"
              method="post">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="emailInput"
                        class="form-control"
                        th:field="*{email}"
                        placeholder="e.g. name@example.com"/>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}">
                </div>

            </div>


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-key"></i>
                    </span>

                    <input
                        type="password"
                        id="passwordInput"
                        class="form-control"
                        th:field="*{password}"
                        placeholder="Enter password"/>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}">
                </div>

            </div>


            <!-- SIGN IN -->
            <button
                type="submit"
                class="btn login-submit w-100">

                <i class="bi bi-box-arrow-in-right me-1"></i>
                Sign In

            </button>

        </form>


        <!-- QUICK FILL -->
        <div class="login-demo-section mt-4 pt-3">

            <div class="small fw-semibold text-muted mb-2 text-center">
                Click to Quick-Fill Demo Credentials:
            </div>

            <div class="d-flex flex-column gap-2">

                <button
                    type="button"
                    class="btn btn-sm demo-login-button text-start"
                    onclick="fillDemo('admin@ledgerbank.com', 'admin123')">

                    <i class="bi bi-shield-fill text-danger me-1"></i>

                    <strong>Admin:</strong>
                    admin@ledgerbank.com (admin123)

                </button>


                <button
                    type="button"
                    class="btn btn-sm demo-login-button text-start"
                    onclick="fillDemo('juan.delacruz@example.com', 'password123')">

                    <i class="bi bi-person-fill text-primary me-1"></i>

                    <strong>Customer:</strong>
                    juan.delacruz@example.com (password123)

                </button>


                <button
                    type="button"
                    class="btn btn-sm demo-login-button text-start"
                    onclick="fillDemo('maria.santos@example.com', 'password123')">

                    <i class="bi bi-person-fill text-info me-1"></i>

                    <strong>Customer:</strong>
                    maria.santos@example.com (password123)

                </button>

            </div>

        </div>


        <!-- REGISTER -->
        <p class="text-center text-muted small mt-4 mb-0">

            Don't have an account yet?

            <a
                href="/register"
                class="fw-semibold login-register-link">

                Start KYC Onboarding

            </a>

        </p>

    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>


<!-- FLOATING THEME TOGGLE -->
<button
    type="button"
    class="login-theme-toggle"
    id="loginThemeToggle"
    aria-label="Toggle dark mode"
    title="Toggle dark mode">

    <i class="bi bi-moon-fill" id="loginThemeIcon"></i>

</button>


<!-- THEME + DEMO SCRIPT -->
<script>

(function () {

    const body = document.body;

    const toggle =
        document.getElementById("loginThemeToggle");

    const icon =
        document.getElementById("loginThemeIcon");

    const savedTheme =
        localStorage.getItem("banking-theme");


    if (savedTheme === "dark") {
        body.classList.add("dark-mode");
    }


    function updateIcon() {

        if (body.classList.contains("dark-mode")) {

            icon.className =
                "bi bi-sun-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to light mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to light mode"
            );

        } else {

            icon.className =
                "bi bi-moon-fill";

            toggle.setAttribute(
                "aria-label",
                "Switch to dark mode"
            );

            toggle.setAttribute(
                "title",
                "Switch to dark mode"
            );

        }

    }


    updateIcon();


    toggle.addEventListener(
        "click",
        function () {

            body.classList.toggle("dark-mode");

            const isDark =
                body.classList.contains("dark-mode");

            localStorage.setItem(
                "banking-theme",
                isDark ? "dark" : "light"
            );

            updateIcon();

        }
    );

})();


function fillDemo(email, pass) {

    document.getElementById(
        "emailInput"
    ).value = email;

    document.getElementById(
        "passwordInput"
    ).value = pass;

}

</script>

</body>
</html>
