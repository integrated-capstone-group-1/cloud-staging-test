<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Sign In')}"></head>

<body class="banking-login">

<div th:replace="~{fragments/layout :: demoBar}"></div>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">

    <div class="card auth-card p-4 p-md-5">

        <!-- LOGIN HEADER -->
        <div class="text-center mb-4">

            <div class="login-icon mb-2">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h3 class="fw-bold mb-1">
                Admin Portal Sign In
            </h3>

            <p class="text-muted small mb-0">
                Authorized access for banking operations, compliance, and systems administration
            </p>

        </div>

        <!-- LOGIN FORM -->
        <form th:action="@{/login}"
              th:object="${loginForm}"
              method="post">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Staff Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="emailInput"
                        class="form-control"
                        th:field="*{email}"
                        placeholder="e.g. admin@ledgerbank.com"/>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}">
                </div>

            </div>


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-key"></i>
                    </span>

                    <input
                        type="password"
                        id="passwordInput"
                        class="form-control"
                        th:field="*{password}"
                        placeholder="Enter admin password"/>

                </div>

                <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}">
                </div>

            </div>


            <!-- SIGN IN BUTTON -->
            <button
                type="submit"
                class="btn login-submit w-100">

                <i class="bi bi-shield-check me-1"></i>
                Sign In to Admin Console

            </button>

        </form>


        <!-- QUICK FILL -->
        <div class="login-demo-section mt-4 pt-3">

            <div class="small fw-semibold text-muted mb-2 text-center">
                Click to Quick-Fill Administrative Credentials:
            </div>

            <div class="d-flex flex-column gap-2">

                <button
                    type="button"
                    class="btn btn-sm demo-login-button text-start p-2"
                    onclick="fillDemo('admin@ledgerbank.com', 'admin123')">

                    <i class="bi bi-shield-fill text-danger me-1"></i>

                    <strong>Administrator:</strong>
                    admin@ledgerbank.com (admin123)

                </button>

            </div>

        </div>


        <!-- STAFF POLICY NOTE -->
        <div class="text-center text-muted small mt-4 mb-0 pt-2 border-top">
            <i class="bi bi-shield-exclamation text-warning me-1"></i>
            Restricted System: Access monitored and audited under compliance policy.
        </div>

    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script>
function fillDemo(email, password) {
    document.getElementById("emailInput").value = email;
    document.getElementById("passwordInput").value = password;
}
</script>

</body>
</html>
