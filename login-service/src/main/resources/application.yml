server:
  port: 8082

spring:
  application:
    name: login-service
  datasource:
    url: ${CHANNEL_DB_URL:jdbc:postgresql://localhost:5432/channel_db}
    username: ${CHANNEL_DB_USERNAME:channel_user}
    password: ${CHANNEL_DB_PASSWORD:ChannelUserPass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: LoginHikariPool
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:CapstoneBankingSuperSecretSigningKeyMustBe256BitsLong!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      service: login-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

---
spring:
  config:
    activate:
      on-profile: azure
  data:
    redis:
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false
